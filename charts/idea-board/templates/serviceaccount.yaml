{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "idea-board.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
  annotations:
    # Created as a pre-install/pre-upgrade hook at weight -20 so it exists BEFORE
    # the migration Job hook (weight 0), which runs as this ServiceAccount.
    # No hook-succeeded/hook-failed delete policy -> it persists for the app pods.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

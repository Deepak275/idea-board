apiVersion: v1
kind: Service
metadata:
  # Contract-mandated name: "idea-board-frontend".
  name: {{ include "idea-board.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idea-board.frontend.labels" . | nindent 4 }}
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "idea-board.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP

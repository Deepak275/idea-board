{{- if .Values.externalSecret.enabled -}}
# ---------------------------------------------------------------------------
# ExternalSecret "idea-board-db"
#
# The External Secrets Operator reads the full DATABASE_URL from the
# ClusterSecretStore "cloud-secrets" (provider chosen per-cloud in the platform
# layer: AWS Secrets Manager / GCP Secret Manager) at the remote key
# "idea-board/db", and writes it into a K8s Secret of the same name. The backend
# Deployment and the migration Job both consume that Secret's DATABASE_URL key.
#
# WHY THIS IS A HELM HOOK:
#   The schema-migration Job runs as a pre-install/pre-upgrade hook and needs
#   DATABASE_URL to exist BEFORE it runs. Normal (non-hook) resources are only
#   applied AFTER pre-* hooks, which would leave the migration Job with no
#   Secret on a fresh install. Declaring this ExternalSecret as a pre-* hook
#   with a lower hook-weight guarantees ESO has materialised the Secret before
#   the migration Job pod starts.
#
#   creationPolicy: Orphan + deletionPolicy: Retain ensure the derived Secret is
#   NOT owner-referenced and is never GC'd when Helm re-creates this hook on an
#   upgrade (before-hook-creation delete+recreate), so the running backend never
#   loses its DATABASE_URL. NOTE (honest caveat): because hook resources are not
#   tracked in the release manifest, `helm uninstall` may leave this
#   ExternalSecret and its Secret behind; delete them manually if desired.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.deletionPolicy }}
    template:
      type: Opaque
  data:
    - secretKey: {{ .Values.database.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        {{- if .Values.externalSecret.remoteProperty }}
        property: {{ .Values.externalSecret.remoteProperty | quote }}
        {{- end }}
{{- end }}

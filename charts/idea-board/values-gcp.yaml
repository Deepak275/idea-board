# ---------------------------------------------------------------------------
# GCP overlay for the idea-board chart.
#
# Applied on top of values.yaml:
#     helm upgrade --install idea-board charts/idea-board \
#         -f values.yaml -f values-gcp.yaml
#
# CONTRACT: this overlay differs from values.yaml (and from values-aws.yaml) in
# only three dimensions — the storageClass, cloud LoadBalancer annotations, and
# the Secret Manager remote-key NAME (GCP forbids "/" in secret names, so the
# key is idea-board-db here vs idea-board/db on AWS). No app logic here.
# ---------------------------------------------------------------------------

# The GKE balanced persistent-disk StorageClass.
storageClass: standard-rwo

# GCP Secret Manager secret IDs cannot contain "/", so the ESO remote key is
# hyphenated here (the module creates secret "idea-board-db"); AWS Secrets
# Manager allows "/" so the base value stays "idea-board/db".
externalSecret:
  remoteKey: idea-board-db

# Cloud LoadBalancer annotations. The public LB is the ingress-nginx controller
# Service (installed by the platform layer); these annotations are surfaced here
# so that if a component Service is switched to type: LoadBalancer it provisions
# a GCP LB with the right settings. They are inert while the Services are the
# default ClusterIP + Ingress topology.
backend:
  service:
    annotations: {}
frontend:
  service:
    annotations:
      cloud.google.com/l4-rbs: enabled
      networking.gke.io/load-balancer-type: External

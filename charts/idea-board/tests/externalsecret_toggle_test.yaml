suite: externalSecret toggle
# Guards the toggle the manual/LB deploy relies on: with externalSecret.enabled
# = false you can supply the idea-board-db Secret yourself (no ESO/IRSA needed);
# with it true, the chart emits the ExternalSecret for the operator to sync.
templates:
  - templates/externalsecret-db.yaml
tests:
  - it: emits an ExternalSecret by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret

  - it: emits nothing when disabled
    set:
      externalSecret.enabled: false
    asserts:
      - hasDocuments:
          count: 0

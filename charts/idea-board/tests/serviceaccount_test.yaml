suite: service account hook ordering
# The migration Job runs as this ServiceAccount via a pre-upgrade hook, so the
# SA must be created FIRST. It's a hook at weight -20 (before the migration Job
# at 0) and must NOT be deleted after success (the app pods use it too).
templates:
  - templates/serviceaccount.yaml
tests:
  - it: is a pre-install/pre-upgrade hook created before the migration Job
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"
      # weight -20 < the migration Job's 0, so the SA exists before it runs.
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      # must NOT carry hook-succeeded/hook-failed, or the app would lose its SA.
      - notMatchRegex:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          pattern: hook-succeeded

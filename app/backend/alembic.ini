# Alembic configuration for the Idea Board backend.
#
# The database URL is NOT stored here. It is injected at runtime from the
# DATABASE_URL environment variable (see alembic/env.py), keeping the app
# strictly 12-factor and free of secrets in source control.

[alembic]
# Path (relative to this file / CWD) to the migration environment.
script_location = alembic

# Ensure the CWD is importable so `alembic/env.py` can `import app.models`.
prepend_sys_path = .

# Use OS-native path separators when generating version file paths.
version_path_separator = os

# sqlalchemy.url is set programmatically in env.py from DATABASE_URL.
# sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# nginx server config for the Idea Board SPA.
# Mounted at /etc/nginx/conf.d/default.conf in the container image.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The runtime env config must never be cached so deploy-time overrides of the
    # API base URL take effect immediately.
    location = /env-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Never cache the HTML entrypoint so new asset hashes are picked up promptly.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build assets are immutable and safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Lightweight liveness endpoint for the frontend container.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: unknown routes are served by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

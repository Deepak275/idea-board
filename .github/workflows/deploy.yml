# =============================================================================
# Build & Deploy.
#
# PUSH to main       -> BUILD ONLY: build + push images to GHCR + image security
#                       scan (vuln/secret/misconfig). Nothing is deployed.
# MANUAL dispatch    -> FULL pipeline: verify gate -> build -> deploy to the
#                       chosen cloud (aws|gcp, or both via matrix).
#
# Deploy flow (per cloud), all on manual dispatch only:
#   verify ─► build ─► [matrix per cloud]
#     1. terraform apply infra/stacks/<cloud>   (VPC + cluster + Postgres)
#     2. scripts/get-kubeconfig.sh <cloud>       (the ONLY cloud auth shim)
#     3. terraform apply infra/platform          (add-ons: ingress-nginx,
#        cert-manager, external-secrets + ClusterSecretStore "cloud-secrets")
#     4. helm upgrade --install idea-board       (-f values.yaml -f values-<cloud>.yaml,
#        with the freshly built image tags; migration runs as a pre-upgrade Job)
#     5. checks: DETERMINISTIC gate = helm rollout OK + public URL returns 200.
#        AI health-check (Claude proposes -> schema-validated) runs ADVISORY only.
#     6. on failed gate: `helm rollback` + post a summary.
#
# Security posture:
#   * Cloud auth is OIDC only — NO long-lived cloud keys are stored.
#   * The LLM never receives cloud credentials or Kubernetes Secrets; it only
#     sees redacted kubectl text (see ai/healthcheck), and it never gates.
#   * ANTHROPIC_API_KEY is optional; without it the AI check is skipped.
# =============================================================================
name: Build & Deploy

# Push to main  -> BUILD only: build + push images to GHCR + image security scan
#                  (continuous delivery of artifacts; nothing is deployed).
# Manual dispatch -> FULL pipeline: verify gate -> build -> deploy to the chosen
#                  cloud (deliberate, because it applies infra + exposes a public
#                  URL on a billing cluster).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target cloud"
        type: choice
        options: [aws, gcp]
        default: aws
      environment:
        description: "Deployment environment (maps to a GitHub Environment for protection rules)"
        type: string
        default: production
      deploy_both:
        description: "Deploy to BOTH clouds (matrix fan-out; ignores the 'cloud' input)"
        type: boolean
        default: false

# Least privilege by default; jobs widen as needed.
permissions:
  contents: read

concurrency:
  # Never run two deploys of the same environment concurrently.
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TF_VERSION: "1.16.1"
  RELEASE: idea-board
  NAMESPACE: idea-board

jobs:
  # ---------------------------------------------------------------------------
  # Build & push both images ONCE (they are cloud-independent). Deterministic
  # tag = sha-<short>. GHCR paths use the lowercased owner (registry requires it).
  # ---------------------------------------------------------------------------
  build:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # upload image-scan SARIF to the Security tab
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image coordinates
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "owner=$owner"
            echo "tag=$tag"
            echo "backend_image=${REGISTRY}/${owner}/idea-board-backend"
            echo "frontend_image=${REGISTRY}/${owner}/idea-board-frontend"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy image scan (vuln + secret + misconfig, report-mode)
        continue-on-error: true # report-mode: drop this line to GATE the build on findings after triage
        env:
          BE: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
          FE: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
        run: |
          scan() { # $1=image  $2=sarif output
            echo "== scanning $1 =="
            trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress "$1" || true
            trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
              --ignore-unfixed --format sarif --output "$2" "$1" || true
          }
          scan "$BE" backend.sarif
          scan "$FE" frontend.sarif

      - name: Upload backend image findings to the Security tab
        if: hashFiles('backend.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend.sarif
          category: trivy-image-backend

      - name: Upload frontend image findings to the Security tab
        if: hashFiles('frontend.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frontend.sarif
          category: trivy-image-frontend

  # ---------------------------------------------------------------------------
  # Pre-deploy GATE: run the same quality checks as CI so a broken commit never
  # deploys. The deploy job `needs:` this.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (lint + tests + tf + helm) — gate before deploy
    if: github.event_name == 'workflow_dispatch' # only gates a real deploy; CI covers pushes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Backend lint + tests
        run: |
          pip install -r app/backend/requirements-dev.txt ruff
          python -m ruff check app/backend ai
          ( cd app/backend && python -m pytest -q )
      - name: Terraform fmt + validate + unit tests + contract
        run: |
          set -e
          terraform fmt -check -recursive infra
          for d in infra/stacks/aws infra/stacks/gcp infra/platform; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
          for d in infra/modules/aws/cluster infra/modules/aws/database infra/modules/gcp/cluster infra/modules/gcp/database; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" test
          done
          bash infra/tests/contract_parity.sh
      - name: Helm lint + unittest
        run: |
          set -e
          for c in aws gcp; do
            helm lint charts/idea-board -f charts/idea-board/values.yaml -f charts/idea-board/values-$c.yaml
          done
          helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          helm unittest charts/idea-board

  # ---------------------------------------------------------------------------
  # Turn the inputs into a matrix: ["aws"] | ["gcp"] | ["aws","gcp"].
  # ---------------------------------------------------------------------------
  matrix:
    name: Resolve deploy matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      clouds: ${{ steps.mk.outputs.clouds }}
    steps:
      - id: mk
        run: |
          if [ "${{ github.event.inputs.deploy_both }}" = "true" ]; then
            echo 'clouds=["aws","gcp"]' >> "$GITHUB_OUTPUT"
          else
            echo "clouds=[\"${{ github.event.inputs.cloud }}\"]" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Deploy: one job per selected cloud. fail-fast=false so one cloud failing
  # does not cancel the other.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ matrix.cloud }})
    if: github.event_name == 'workflow_dispatch' # never auto-deploys on push
    needs: [verify, build, matrix]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC cloud auth (no static keys)
      packages: read
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.matrix.outputs.clouds) }}
    defaults:
      run:
        shell: bash
    env:
      CLOUD: ${{ matrix.cloud }}
      TAG: ${{ needs.build.outputs.tag }}
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
      # Where the app is reachable once deployed (also used in the run summary).
      INGRESS_HOST: ${{ vars.INGRESS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0 # pinned to match local

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install AI health-check dependencies
        run: pip install -r ai/healthcheck/requirements.txt

      # ---- Cloud authentication via OIDC ------------------------------------
      - name: Authenticate to AWS (OIDC)
        if: ${{ matrix.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud + GKE auth plugin
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # ---- 1) Cloud stack: network + cluster + database ---------------------
      # Region/project are passed as TF_VAR_* env: Terraform silently ignores an
      # env var for a variable a stack doesn't declare, so the same block works
      # for both the AWS stack (region) and the GCP stack (region + project).
      - name: Terraform apply — cloud stack
        env:
          TF_VAR_cloud: ${{ matrix.cloud }}
          TF_VAR_region: ${{ matrix.cloud == 'aws' && vars.AWS_REGION || vars.GCP_REGION }}
          TF_VAR_project: ${{ vars.GCP_PROJECT }}
          # Grant the deploy role EKS cluster-admin via an Access Entry (AWS stack
          # only; TF ignores an undeclared TF_VAR for the GCP stack).
          TF_VAR_cluster_admin_principals: ${{ matrix.cloud == 'aws' && format('["{0}"]', vars.AWS_DEPLOY_ROLE_ARN) || '[]' }}
        run: |
          set -e
          if [ "$CLOUD" = "aws" ]; then
            terraform -chdir=infra/stacks/aws init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="key=idea-board/aws/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
              -backend-config="encrypt=true"
          else
            terraform -chdir=infra/stacks/gcp init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="prefix=idea-board/gcp"
          fi
          terraform -chdir="infra/stacks/$CLOUD" apply -auto-approve -input=false

      # ---- 2) Point kubeconfig at the new cluster (THE cloud auth shim) ------
      - name: Get kubeconfig
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          chmod +x scripts/get-kubeconfig.sh
          ./scripts/get-kubeconfig.sh "$CLOUD"

      # ---- Mint a short-lived bearer token for the platform TF providers -----
      # The portable platform layer authenticates purely from kube_host/
      # kube_ca_cert/kube_token vars (no cloud SDK). We read host/CA from the
      # stack outputs and mint the token with the cloud CLI here.
      - name: Resolve cluster connection details
        id: kube
        run: |
          set -e
          CLUSTER=$(terraform -chdir="infra/stacks/$CLOUD" output -raw cluster_name)
          REGION=$(terraform -chdir="infra/stacks/$CLOUD" output -raw region)
          KUBE_HOST=$(terraform -chdir="infra/stacks/$CLOUD" output -raw kube_host)
          KUBE_CA=$(terraform -chdir="infra/stacks/$CLOUD" output -raw kube_ca_cert)
          if [ "$CLOUD" = "aws" ]; then
            KUBE_TOKEN=$(aws eks get-token --cluster-name "$CLUSTER" --region "$REGION" | jq -r '.status.token')
          else
            KUBE_TOKEN=$(gcloud auth print-access-token)
          fi
          {
            echo "CLUSTER=$CLUSTER"
            echo "REGION=$REGION"
            echo "KUBE_HOST=$KUBE_HOST"
            echo "KUBE_CA=$KUBE_CA"
          } >> "$GITHUB_ENV"
          # Token is sensitive: mask it and pass via env, never echo it.
          echo "::add-mask::$KUBE_TOKEN"
          echo "KUBE_TOKEN=$KUBE_TOKEN" >> "$GITHUB_ENV"

      # ---- 3) Portable platform layer: cluster ADD-ONS only -----------------
      # We -target the add-ons and deliberately do NOT let Terraform install the
      # app chart here: the app is owned by the explicit `helm upgrade` below so
      # the AI gate can `helm rollback` a bad release cleanly. The app-chart
      # resource in infra/platform is for the standalone/manual path.
      - name: Terraform apply — platform add-ons
        run: |
          set -e
          # Persistent remote state (per cloud) so add-ons aren't recreated each run.
          # NOTE: the backend is S3; a real GCP deploy needs its platform state in
          # GCS (or a cloud-neutral backend) — tracked as a known limitation.
          terraform -chdir=infra/platform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=idea-board/${CLOUD}/platform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

          # Cloud-conditional ESO wiring (the only per-cloud platform inputs).
          extra_vars=()
          if [ "$CLOUD" = "aws" ]; then
            extra_vars+=( -var="aws_region=${REGION}" -var="aws_eso_role_arn=${{ vars.AWS_ESO_ROLE_ARN }}" )
          else
            extra_vars+=(
              -var="gcp_project_id=${{ vars.GCP_PROJECT }}"
              -var="gcp_location=${REGION}"
              -var="gcp_cluster_name=${CLUSTER}"
              -var="gcp_eso_service_account_email=${{ vars.GCP_ESO_SA_EMAIL }}"
            )
          fi

          # Idempotency note: infra/platform has no remote backend defined (the
          # contract only mandates remote state for the stacks), so CI state is
          # ephemeral. A re-apply onto already-installed add-ons can report
          # "release already exists"; we tolerate that and continue, because the
          # downstream AI health-check is the real gate — if the ClusterSecretStore
          # is genuinely missing, the app's ExternalSecret won't sync and the gate
          # will roll the release back. In production, point this layer at a
          # remote backend (see infra/platform/README.md).
          terraform -chdir=infra/platform apply -auto-approve -input=false \
            -target=terraform_data.input_guard \
            -target=helm_release.ingress_nginx \
            -target=helm_release.cert_manager \
            -target=kubectl_manifest.letsencrypt_cluster_issuer \
            -target=helm_release.external_secrets \
            -target=kubectl_manifest.cloud_secrets_store \
            -var="cloud=${CLOUD}" \
            -var="kube_host=${KUBE_HOST}" \
            -var="kube_ca_cert=${KUBE_CA}" \
            -var="kube_token=${KUBE_TOKEN}" \
            -var="letsencrypt_email=${{ vars.LETSENCRYPT_EMAIL }}" \
            "${extra_vars[@]}" \
          || echo "::warning::platform add-ons apply returned non-zero (add-ons may already exist); continuing — the AI health-check gates the result."

      # ---- 4) Install/upgrade the app with the freshly built images ---------
      - name: Helm upgrade --install idea-board
        id: helm
        continue-on-error: true # a failed rollout must reach the AI gate + rollback below
        run: |
          set -e
          args=(
            --namespace "$NAMESPACE" --create-namespace
            -f charts/idea-board/values.yaml
            -f "charts/idea-board/values-${CLOUD}.yaml"
            --set "backend.image.repository=${BACKEND_IMAGE}"
            --set "backend.image.tag=${TAG}"
            --set "frontend.image.repository=${FRONTEND_IMAGE}"
            --set "frontend.image.tag=${TAG}"
          )
          if [ -n "${INGRESS_HOST}" ]; then
            # A real hostname was provided: pin the ingress to it (TLS from the
            # chart default applies — point DNS at the LB and Let's Encrypt issues).
            args+=( --set "ingress.host=${INGRESS_HOST}" )
          else
            # No domain: serve as an HTTP-only catch-all so the load balancer's
            # own hostname is a working public URL (no DNS purchase needed).
            args+=( --set "ingress.host=" --set "ingress.tls.enabled=false" )
          fi
          helm upgrade --install "$RELEASE" charts/idea-board \
            "${args[@]}" --wait --timeout 10m

      # ---- 5a) AI health-check (ADVISORY) -----------------------------------
      # Claude proposes a structured verdict; ai/healthcheck validates it against
      # a JSON Schema. ADVISORY for now: it does NOT gate the release — the
      # deterministic checks below (helm rollout + public-URL 200) decide. If no
      # ANTHROPIC_API_KEY is set it is skipped cleanly. To make it a hard gate
      # again, re-add `[ "$hc" = "0" ]` to the verdict below.
      - name: AI health-check (advisory)
        id: health
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "no ANTHROPIC_API_KEY set — skipping AI health-check (advisory only)" | tee healthcheck.out
            echo "hc_code=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python ai/healthcheck/main.py --namespace "$NAMESPACE" | tee healthcheck.out
          code=${PIPESTATUS[0]}
          echo "hc_code=$code" >> "$GITHUB_OUTPUT"
          echo "health-check exit code: $code"

      # ---- 5b) Post-deploy link/smoke check: does the PUBLIC URL return 200? -
      - name: Post-deploy link check
        id: linkcheck
        continue-on-error: true
        run: |
          set +e
          # The ingress matches on a specific Host (spec.rules[0].host). To smoke-
          # test without owning DNS, we present that Host header but --connect-to
          # the load balancer's own address — so this verifies real ingress path
          # routing whether or not INGRESS_HOST is a resolvable domain.
          # ING_HOST is the ingress rule's host. In catch-all mode (no domain) it
          # is intentionally EMPTY, so we hit the load balancer directly; when a
          # real host is pinned we present it as a Host header and --connect-to
          # the LB (works without owning DNS).
          ING_HOST=$(kubectl -n "$NAMESPACE" get ingress -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null)
          link_ok=1 LB=""
          for i in $(seq 1 16); do
            [ -z "$LB" ] && LB=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -z "$LB" ] && LB=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$LB" ]; then
              if [ -n "$ING_HOST" ]; then
                api=$(curl -s -o /dev/null -w '%{http_code}' --connect-to "${ING_HOST}:80:${LB}:80" "http://${ING_HOST}/api/ideas")
                root=$(curl -s -o /dev/null -w '%{http_code}' --connect-to "${ING_HOST}:80:${LB}:80" "http://${ING_HOST}/")
              else
                api=$(curl -s -o /dev/null -w '%{http_code}' "http://${LB}/api/ideas")
                root=$(curl -s -o /dev/null -w '%{http_code}' "http://${LB}/")
              fi
              echo "attempt $i (LB=$LB host='${ING_HOST:-<catch-all>}'): /api/ideas=$api  /=$root"
              { [ "$api" = "200" ] && [ "$root" = "200" ]; } && { link_ok=0; break; }
            else
              echo "attempt $i: waiting for ingress-nginx load balancer address..."
            fi
            sleep 15
          done
          echo "link_ok=$link_ok" >> "$GITHUB_OUTPUT"
          echo "app_host=${ING_HOST:-$LB}" >> "$GITHUB_OUTPUT"
          echo "lb_addr=$LB" >> "$GITHUB_OUTPUT"

      # ---- 6) Decide: keep, or roll back + summarise ------------------------
      - name: Gate — keep or roll back the release
        if: always()
        run: |
          set +e
          helm_outcome='${{ steps.helm.outcome }}'   # success | failure
          hc='${{ steps.health.outputs.hc_code }}'   # 0 healthy / 1 unhealthy / 2 error / skip — ADVISORY
          hc="${hc:-skip}"
          lc='${{ steps.linkcheck.outputs.link_ok }}' # 0 = public URL returned 200 on / and /api/ideas
          lc="${lc:-1}"

          # DETERMINISTIC gate: keep only if the rollout succeeded AND the public
          # URL actually serves 200. The AI health-check ($hc) is advisory and
          # deliberately NOT part of this decision.
          verdict_ok=false
          if [ "$helm_outcome" = "success" ] && [ "$lc" = "0" ]; then
            verdict_ok=true
          fi

          {
            echo "# Deploy summary — ${CLOUD} / ${{ github.event.inputs.environment }}"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| cloud | \`${CLOUD}\` |"
            echo "| release | \`${RELEASE}\` (ns \`${NAMESPACE}\`) |"
            echo "| backend image | \`${BACKEND_IMAGE}:${TAG}\` |"
            echo "| frontend image | \`${FRONTEND_IMAGE}:${TAG}\` |"
            echo "| helm upgrade | \`${helm_outcome}\` |"
            echo "| AI health-check (advisory) | \`${hc}\` (0=healthy,1=unhealthy,2=inconclusive,skip=no key) |"
            echo "| link check (/ + /api/ideas == 200?) | \`${lc}\` (0=ok) — **gates the release** |"
            APP_HOST='${{ steps.linkcheck.outputs.app_host }}'
            LB_ADDR='${{ steps.linkcheck.outputs.lb_addr }}'
            [ -n "${APP_HOST}" ] && echo "| ingress host | \`${APP_HOST}\` |"
            [ -n "${LB_ADDR}" ] && echo "| load balancer | \`${LB_ADDR}\` (point a DNS record here, or set INGRESS_HOST) |"
            echo
            echo "## AI health-check output"
            echo '```'
            cat healthcheck.out 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict_ok" = "true" ]; then
            echo "✅ Deployment verified healthy — keeping release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Deployment not verified healthy (helm=${helm_outcome}, link-check=${lc}; AI advisory=${hc}); rolling back." | tee -a "$GITHUB_STEP_SUMMARY"

          # Roll back only if there is a prior revision; otherwise remove the
          # failed first install so the cluster is left clean.
          revs=$(helm history "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
          if [ "${revs:-0}" -gt 1 ]; then
            echo "Rolling back \`${RELEASE}\` to the previous revision..." | tee -a "$GITHUB_STEP_SUMMARY"
            helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 10m \
              && echo "Rollback complete." | tee -a "$GITHUB_STEP_SUMMARY" \
              || echo "::error::helm rollback failed — manual intervention required."
          else
            echo "No previous revision; uninstalling the failed release." | tee -a "$GITHUB_STEP_SUMMARY"
            helm uninstall "$RELEASE" -n "$NAMESPACE" || true
          fi

          # Fail the job so the pipeline reflects the unhealthy deploy.
          exit 1

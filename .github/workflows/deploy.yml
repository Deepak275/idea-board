# =============================================================================
# Build & Deploy — the APP half of the split pipeline.
#
# This workflow owns the APPLICATION lifecycle only: build + push images and
# deploy the idea-board Helm chart onto an ALREADY-provisioned cluster. Anything
# that MUTATES the cloud account — the Terraform cloud stack (VPC + cluster +
# Postgres) and the portable platform add-ons (ingress-nginx, cert-manager,
# external-secrets + the "cloud-secrets" ClusterSecretStore) — lives in
# "Provision infrastructure" (.github/workflows/provision.yml). This workflow
# NEVER runs `terraform apply`; it only READS the stack's remote state.
#
# Triggers:
#   PUSH to main (app/**, charts/**, this file)   -> full app pipeline.
#   MANUAL dispatch                               -> full app pipeline (pick cloud).
#   workflow_run after "Provision infrastructure" -> redeploy once infra is ready.
#
# Deploy flow (per cloud):
#   [verify] ─► build ─► [matrix per cloud] ─► deploy
#     1. terraform init + `terraform output -raw`  (READ-ONLY: read cluster_name /
#        region from the stack's remote state — NO apply, NO state lock)
#     2. scripts/get-kubeconfig.sh <cloud>         (the ONLY cloud auth shim)
#     3. helm upgrade --install idea-board         (-f values.yaml -f values-<cloud>.yaml,
#        with the freshly built image tags; migration runs as a pre-upgrade Job)
#     4. checks: DETERMINISTIC gate = helm rollout OK + public URL returns 200.
#        AI health-check (Claude proposes -> schema-validated) runs ADVISORY only.
#     5. on failed gate: `helm rollback` + post a summary.
#
# Security posture:
#   * Cloud auth is OIDC only — NO long-lived cloud keys are stored.
#   * The LLM never receives cloud credentials or Kubernetes Secrets; it only
#     sees redacted kubectl text (see ai/healthcheck), and it never gates.
#   * ANTHROPIC_API_KEY is optional; without it the AI check is skipped.
#
# ---------------------------------------------------------------------------
# LEAST-PRIVILEGE TODO (shared convention with provision.yml):
#   For now BOTH "Build & Deploy" and "Provision infrastructure" assume the
#   single OIDC role vars.AWS_DEPLOY_ROLE_ARN. Recommended follow-up is to split
#   into two least-privilege roles:
#     * provision  = MUTATE infra (terraform apply on the stack + platform)
#     * app deploy = READ remote state + CONNECT to the cluster (helm/kubectl)
#   IF you split them, provision's stack TF_VAR_cluster_admin_principals MUST
#   still include THIS app-deploy role ARN (in addition to the provision role),
#   or helm/kubectl below will be RBAC-denied on the EKS Access Entry.
# ---------------------------------------------------------------------------
# =============================================================================
name: Build & Deploy

# App-CD posture: auto-deploy on APP changes merged to main; deliberate manual
# dispatch; and an optional redeploy right after infra is (re)provisioned. This
# is safe because `helm upgrade --install` is idempotent and the link-check +
# rollback gate protects every path.
on:
  # Auto-deploy only when the APP or its chart changes (infra pushes are handled
  # by "Provision infrastructure"; this file itself so pipeline edits self-test).
  push:
    branches: [main]
    paths:
      - "app/**"
      - "charts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target cloud"
        type: choice
        options: [aws, gcp]
        default: aws
      environment:
        description: "Deployment environment (maps to a GitHub Environment for protection rules)"
        type: string
        default: production
      deploy_both:
        description: "Deploy to BOTH clouds (matrix fan-out; ignores the 'cloud' input)"
        type: boolean
        default: false
  # Optional: redeploy the app once "Provision infrastructure" finishes (e.g. a
  # freshly (re)built cluster). The deploy job gates on conclusion == 'success';
  # workflow_run does NOT auto-checkout the triggering commit, so that job checks
  # out github.event.workflow_run.head_sha explicitly.
  workflow_run:
    workflows: ["Provision infrastructure"]
    types: [completed]

# Least privilege by default; jobs widen as needed.
permissions:
  contents: read

concurrency:
  # Never run two deploys of the same environment concurrently.
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TF_VERSION: "1.16.1"
  RELEASE: idea-board
  NAMESPACE: idea-board

jobs:
  # ---------------------------------------------------------------------------
  # Build -> SCAN -> push (in that order): images are built LOCALLY, Trivy-gated
  # (fixable CRITICAL vulns or leaked secrets BLOCK the push; HIGH is reported to
  # the Security tab), and only then pushed to GHCR. Gated on `verify` so a
  # lint/test/tf/helm failure never builds.
  # Deterministic tag = sha-<short>; GHCR paths use the lowercased owner.
  # ---------------------------------------------------------------------------
  build:
    name: Build, scan & push images (GHCR)
    needs: verify # no image is built/scanned/pushed unless validation passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # upload image-scan SARIF to the Security tab
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image coordinates
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="sha-${GITHUB_SHA::7}"
          {
            echo "owner=$owner"
            echo "tag=$tag"
            echo "backend_image=${REGISTRY}/${owner}/idea-board-backend"
            echo "frontend_image=${REGISTRY}/${owner}/idea-board-frontend"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) BUILD LOCALLY (load into the runner's docker) — do NOT push yet, so a
      #    vulnerable image never reaches the registry.
      - name: Build backend image (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: false
          load: true
          tags: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (local, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: false
          load: true
          tags: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      # 2a) REPORT: full findings (vuln+secret+misconfig) -> Security tab. Never blocks.
      - name: Trivy SARIF (report to the Security tab)
        continue-on-error: true
        env:
          BE: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
          FE: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
        run: |
          trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --format sarif --output backend.sarif  "$BE" || true
          trivy image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --format sarif --output frontend.sarif "$FE" || true

      - name: Upload backend image findings to the Security tab
        if: ${{ always() && hashFiles('backend.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend.sarif
          category: trivy-image-backend

      - name: Upload frontend image findings to the Security tab
        if: ${{ always() && hashFiles('frontend.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frontend.sarif
          category: trivy-image-frontend

      # 2b) GATE: BLOCK the push on fixable CRITICAL vulns OR any leaked secret —
      #     the severe/exploitable + credential-leak class (hard stop). HIGH vulns
      #     are REPORTED to the Security tab (step 2a) for triage, not blocked:
      #     blocking every transitive-dep / base-image HIGH is an unsustainable
      #     treadmill. Tighten to HIGH once base images are on a clean patch cadence.
      #     A blocked gate never pushes the image and skips the deploy (live app
      #     keeps its current image).
      - name: Trivy gate — blocks push on CRITICAL vulns or leaked secrets
        env:
          BE: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
          FE: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
        run: |
          set -e
          for img in "$BE" "$FE"; do
            echo "== gate: fixable CRITICAL vulns in $img =="
            trivy image --scanners vuln --severity CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "$img"
            echo "== gate: leaked secrets in $img =="
            trivy image --scanners secret --exit-code 1 --no-progress "$img"
          done

      # 3) PUSH — only reached if `verify` passed AND the gate above passed. The
      #    layers are cache-hits from the local build, so this is a near-instant push.
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # Pre-deploy GATE: run the same quality checks as CI so a broken commit never
  # deploys. The deploy job `needs:` this.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (lint + tests + tf + helm) — gate before build
    # Runs on every trigger now: `build` needs it, so a lint/test/tf/helm failure
    # stops the image from being built or pushed (not just the deploy).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Backend lint + tests
        run: |
          pip install -r app/backend/requirements-dev.txt ruff
          python -m ruff check app/backend ai
          ( cd app/backend && python -m pytest -q )
      - name: Terraform fmt + validate + unit tests + contract
        run: |
          set -e
          terraform fmt -check -recursive infra
          for d in infra/stacks/aws infra/stacks/gcp infra/platform; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
          for d in infra/modules/aws/cluster infra/modules/aws/database infra/modules/gcp/cluster infra/modules/gcp/database; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" test
          done
          bash infra/tests/contract_parity.sh
      - name: Helm lint + unittest
        run: |
          set -e
          for c in aws gcp; do
            helm lint charts/idea-board -f charts/idea-board/values.yaml -f charts/idea-board/values-$c.yaml
          done
          helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          helm unittest charts/idea-board

  # ---------------------------------------------------------------------------
  # Turn the inputs into a matrix: ["aws"] | ["gcp"] | ["aws","gcp"].
  # ---------------------------------------------------------------------------
  matrix:
    name: Resolve deploy matrix
    # Must run on EVERY path that can reach `deploy` (push / dispatch /
    # workflow_run-after-success) so the matrix output is always available to it.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      clouds: ${{ steps.mk.outputs.clouds }}
    steps:
      - id: mk
        run: |
          if [ "${{ github.event.inputs.deploy_both }}" = "true" ]; then
            echo 'clouds=["aws","gcp"]' >> "$GITHUB_OUTPUT"
          else
            # push / workflow_run carry no inputs.cloud -> default to aws
            # (mirrors provision.yml's `resolve` job).
            cloud="${{ github.event.inputs.cloud }}"
            echo "clouds=[\"${cloud:-aws}\"]" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Deploy: one job per selected cloud. fail-fast=false so one cloud failing
  # does not cancel the other.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ matrix.cloud }})
    # STANDARD app-CD posture: deploy on app/charts push, on manual dispatch, and
    # after a successful "Provision infrastructure" run. verify + build + matrix must
    # all have succeeded (build already needs verify, so a verify failure skips build
    # and thus this job). `!cancelled()` + explicit result checks keep the event gate
    # readable and robust across push / dispatch / workflow_run.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.matrix.result == 'success'
      && needs.verify.result != 'failure'
      && (
           github.event_name == 'push'
           || github.event_name == 'workflow_dispatch'
           || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
         )
    needs: [verify, build, matrix]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC cloud auth (no static keys)
      packages: read
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(needs.matrix.outputs.clouds) }}
    defaults:
      run:
        shell: bash
    env:
      CLOUD: ${{ matrix.cloud }}
      TAG: ${{ needs.build.outputs.tag }}
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
      # Where the app is reachable once deployed (also used in the run summary).
      INGRESS_HOST: ${{ vars.INGRESS_HOST }}
    steps:
      # workflow_run does NOT auto-checkout the triggering commit, so for that
      # event we pin to the SHA provisioning ran against. For push / dispatch the
      # expression is empty, which makes actions/checkout fall back to its default
      # (the ref that triggered the run).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0 # pinned to match local

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install AI health-check dependencies
        run: pip install -r ai/healthcheck/requirements.txt

      # ---- Cloud authentication via OIDC ------------------------------------
      - name: Authenticate to AWS (OIDC)
        if: ${{ matrix.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud + GKE auth plugin
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      # ---- 1) Read cluster connection details from the stack's remote state --
      # READ-ONLY: this workflow does NOT provision. "Provision infrastructure"
      # owns `terraform apply`; here we only `init` the SAME remote backend (same
      # backend-config as provision.yml) and read outputs. `terraform output`
      # takes NO state lock and there is NO apply, so a deploy can never mutate
      # the cloud stack. CLUSTER_NAME + REGION feed get-kubeconfig.sh below and
      # the run summary. No TF_VARs are needed to read outputs.
      - name: Terraform outputs — cluster connection (read-only, no apply)
        id: tf
        run: |
          set -e
          if [ "$CLOUD" = "aws" ]; then
            terraform -chdir=infra/stacks/aws init -input=false \
              -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
              -backend-config="key=idea-board/aws/terraform.tfstate" \
              -backend-config="region=${{ vars.AWS_REGION }}" \
              -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
              -backend-config="encrypt=true"
          else
            terraform -chdir=infra/stacks/gcp init -input=false \
              -backend-config="bucket=${{ vars.GCS_STATE_BUCKET }}" \
              -backend-config="prefix=idea-board/gcp"
          fi
          # The two contract outputs later steps + get-kubeconfig.sh consume.
          CLUSTER_NAME=$(terraform -chdir="infra/stacks/$CLOUD" output -raw cluster_name)
          REGION=$(terraform -chdir="infra/stacks/$CLOUD" output -raw region)
          {
            echo "CLUSTER_NAME=$CLUSTER_NAME"
            echo "REGION=$REGION"
          } >> "$GITHUB_ENV"
          echo "Resolved cluster=$CLUSTER_NAME region=$REGION (read-only)"

      # ---- 2) Point kubeconfig at the new cluster (THE cloud auth shim) ------
      - name: Get kubeconfig
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          chmod +x scripts/get-kubeconfig.sh
          ./scripts/get-kubeconfig.sh "$CLOUD"

      # NOTE: the kube bearer-token mint and the "Terraform apply — platform
      # add-ons" step were REMOVED from this app pipeline — both now live in
      # "Provision infrastructure" (provision.yml). The platform TF providers
      # were the ONLY consumers of kube_host / kube_ca_cert / kube_token, so
      # minting a bearer token here is no longer needed: helm + kubectl below
      # authenticate via the kubeconfig get-kubeconfig.sh just wrote. (The stale
      # "infra/platform has no remote backend" idempotency note went with them —
      # the platform layer now uses the S3 backend, keyed
      # idea-board/<cloud>/platform.tfstate; see provision.yml.)

      # ---- 3) Install/upgrade the app with the freshly built images ---------
      - name: Helm upgrade --install idea-board
        id: helm
        continue-on-error: true # a failed rollout must reach the AI gate + rollback below
        run: |
          set -e
          args=(
            --namespace "$NAMESPACE" --create-namespace
            -f charts/idea-board/values.yaml
            -f "charts/idea-board/values-${CLOUD}.yaml"
            --set "backend.image.repository=${BACKEND_IMAGE}"
            --set "backend.image.tag=${TAG}"
            --set "frontend.image.repository=${FRONTEND_IMAGE}"
            --set "frontend.image.tag=${TAG}"
          )
          if [ -n "${INGRESS_HOST}" ]; then
            # A real hostname was provided: pin the ingress to it (TLS from the
            # chart default applies — point DNS at the LB and Let's Encrypt issues).
            args+=( --set "ingress.host=${INGRESS_HOST}" )
          else
            # No domain: serve as an HTTP-only catch-all so the load balancer's
            # own hostname is a working public URL (no DNS purchase needed).
            args+=( --set "ingress.host=" --set "ingress.tls.enabled=false" )
          fi
          helm upgrade --install "$RELEASE" charts/idea-board \
            "${args[@]}" --wait --timeout 10m

      # ---- 4a) AI health-check (ADVISORY) -----------------------------------
      # Claude proposes a structured verdict; ai/healthcheck validates it against
      # a JSON Schema. ADVISORY for now: it does NOT gate the release — the
      # deterministic checks below (helm rollout + public-URL 200) decide. If no
      # ANTHROPIC_API_KEY is set it is skipped cleanly. To make it a hard gate
      # again, re-add `[ "$hc" = "0" ]` to the verdict below.
      - name: AI health-check (advisory)
        id: health
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "no ANTHROPIC_API_KEY set — skipping AI health-check (advisory only)" | tee healthcheck.out
            echo "hc_code=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python ai/healthcheck/main.py --namespace "$NAMESPACE" | tee healthcheck.out
          code=${PIPESTATUS[0]}
          echo "hc_code=$code" >> "$GITHUB_OUTPUT"
          echo "health-check exit code: $code"

      # ---- 4b) Post-deploy link/smoke check: does the PUBLIC URL return 200? -
      - name: Post-deploy link check
        id: linkcheck
        continue-on-error: true
        run: |
          set +e
          # The ingress matches on a specific Host (spec.rules[0].host). To smoke-
          # test without owning DNS, we present that Host header but --connect-to
          # the load balancer's own address — so this verifies real ingress path
          # routing whether or not INGRESS_HOST is a resolvable domain.
          # ING_HOST is the ingress rule's host. In catch-all mode (no domain) it
          # is intentionally EMPTY, so we hit the load balancer directly; when a
          # real host is pinned we present it as a Host header and --connect-to
          # the LB (works without owning DNS).
          ING_HOST=$(kubectl -n "$NAMESPACE" get ingress -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null)
          link_ok=1 LB=""
          for i in $(seq 1 16); do
            [ -z "$LB" ] && LB=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -z "$LB" ] && LB=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
            if [ -n "$LB" ]; then
              if [ -n "$ING_HOST" ]; then
                api=$(curl -s -o /dev/null -w '%{http_code}' --connect-to "${ING_HOST}:80:${LB}:80" "http://${ING_HOST}/api/ideas")
                root=$(curl -s -o /dev/null -w '%{http_code}' --connect-to "${ING_HOST}:80:${LB}:80" "http://${ING_HOST}/")
              else
                api=$(curl -s -o /dev/null -w '%{http_code}' "http://${LB}/api/ideas")
                root=$(curl -s -o /dev/null -w '%{http_code}' "http://${LB}/")
              fi
              echo "attempt $i (LB=$LB host='${ING_HOST:-<catch-all>}'): /api/ideas=$api  /=$root"
              { [ "$api" = "200" ] && [ "$root" = "200" ]; } && { link_ok=0; break; }
            else
              echo "attempt $i: waiting for ingress-nginx load balancer address..."
            fi
            sleep 15
          done
          echo "link_ok=$link_ok" >> "$GITHUB_OUTPUT"
          echo "app_host=${ING_HOST:-$LB}" >> "$GITHUB_OUTPUT"
          echo "lb_addr=$LB" >> "$GITHUB_OUTPUT"

      # ---- 5) Decide: keep, or roll back + summarise ------------------------
      - name: Gate — keep or roll back the release
        if: always()
        run: |
          set +e
          helm_outcome='${{ steps.helm.outcome }}'   # success | failure
          hc='${{ steps.health.outputs.hc_code }}'   # 0 healthy / 1 unhealthy / 2 error / skip — ADVISORY
          hc="${hc:-skip}"
          lc='${{ steps.linkcheck.outputs.link_ok }}' # 0 = public URL returned 200 on / and /api/ideas
          lc="${lc:-1}"

          # DETERMINISTIC gate: keep only if the rollout succeeded AND the public
          # URL actually serves 200. The AI health-check ($hc) is advisory and
          # deliberately NOT part of this decision.
          verdict_ok=false
          if [ "$helm_outcome" = "success" ] && [ "$lc" = "0" ]; then
            verdict_ok=true
          fi

          {
            echo "# Deploy summary — ${CLOUD} / ${{ github.event.inputs.environment }}"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| cloud | \`${CLOUD}\` |"
            echo "| release | \`${RELEASE}\` (ns \`${NAMESPACE}\`) |"
            echo "| backend image | \`${BACKEND_IMAGE}:${TAG}\` |"
            echo "| frontend image | \`${FRONTEND_IMAGE}:${TAG}\` |"
            echo "| helm upgrade | \`${helm_outcome}\` |"
            echo "| AI health-check (advisory) | \`${hc}\` (0=healthy,1=unhealthy,2=inconclusive,skip=no key) |"
            echo "| link check (/ + /api/ideas == 200?) | \`${lc}\` (0=ok) — **gates the release** |"
            APP_HOST='${{ steps.linkcheck.outputs.app_host }}'
            LB_ADDR='${{ steps.linkcheck.outputs.lb_addr }}'
            [ -n "${APP_HOST}" ] && echo "| ingress host | \`${APP_HOST}\` |"
            [ -n "${LB_ADDR}" ] && echo "| load balancer | \`${LB_ADDR}\` (point a DNS record here, or set INGRESS_HOST) |"
            echo
            echo "## AI health-check output"
            echo '```'
            cat healthcheck.out 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict_ok" = "true" ]; then
            echo "✅ Deployment verified healthy — keeping release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Deployment not verified healthy (helm=${helm_outcome}, link-check=${lc}; AI advisory=${hc}); rolling back." | tee -a "$GITHUB_STEP_SUMMARY"

          # Roll back only if there is a prior revision; otherwise remove the
          # failed first install so the cluster is left clean.
          revs=$(helm history "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null | jq 'length' 2>/dev/null || echo 0)
          if [ "${revs:-0}" -gt 1 ]; then
            echo "Rolling back \`${RELEASE}\` to the previous revision..." | tee -a "$GITHUB_STEP_SUMMARY"
            helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 10m \
              && echo "Rollback complete." | tee -a "$GITHUB_STEP_SUMMARY" \
              || echo "::error::helm rollback failed — manual intervention required."
          else
            echo "No previous revision; uninstalling the failed release." | tee -a "$GITHUB_STEP_SUMMARY"
            helm uninstall "$RELEASE" -n "$NAMESPACE" || true
          fi

          # Fail the job so the pipeline reflects the unhealthy deploy.
          exit 1
